    <script>

        let nums=[10,20,30];
        nums[2]=99;
        console.log(nums)
    function getLastValue(array){

        
        return array[array.length-1];
    }
    console.log(getLastValue(['hi','hello','good']))
    console.log(getLastValue([1,20,22,24,5]));



    function swapLastValue(array){

let first=array[0];
let last=array.length-1;
array[0]=array[last];
array[last]=first;

return array;
    }


console.log(swapLastValue(['hi','hello','good']))
    console.log(swapLastValue([1,20,22,24,5]));




    </script>
