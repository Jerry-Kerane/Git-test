<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        function countWord(words){
            const fruit={
            };
            for(let i =0;i<words.length;i++){
                const word=words[i];
                if(!fruit[word]){
                    fruit[word]=1;
                }else{
                    fruit[word]++;
                }
            }
return fruit
        }
        console.log(countWord(['apple','grappe','apple','apple']));
    </script>
</body>
</html>
