<!DOCTYPE html>
<html>
    <head>
      <title>Calculator</title>
      <link rel="stylesheet" href="./10i-calc.css">
    </head>
    
    <body>
  <p class="js-calculate"></p>
 

<button onclick="
        updatecalculation('1')
          updateCalcValue();
        
        
        ">1</button>
      <button
      onclick="
        updatecalculation('2')
          updateCalcValue();
        " 
      >2</button>
      <button onclick="
        updatecalculation('3')
          updateCalcValue();
        
        
        ">3</button>
      <button 
      class="special"
      onclick="
      updatecalculation(' + ')
        updateCalcValue();
      
      "
      
      >+</button>

      <p><button
       onclick="
      updatecalculation('4')
        updateCalcValue();
      
      " 
        
        >4</button>
        <button
        onclick="
      updatecalculation('5')
        updateCalcValue();
      
      "
        
        >5</button>
        <button
        onclick="
      updatecalculation('6')
        updateCalcValue();
      
      "
        
        >6</button>
      <button
      class="special"
      onclick="
      updatecalculation(' - ')  ;   
        updateCalcValue();
      
      "
      
      >-</button></p>
        
      <p><button
        onclick="
      updatecalculation('7')
        updateCalcValue();
      
      "
        
        >7</button>
        <button
        
        onclick="
      updatecalculation('8')
        updateCalcValue();
      
      "
        
        >8</button>
        <button
       
        onclick="
      updatecalculation('9')
        updateCalcValue();
      
      "

        >9</button>
      <button
      class="special"

      onclick="
      updatecalculation(' * ');
        updateCalcValue();
      
      "
      
      >*</button>
      </p>
      <button
        
        onclick="
      updatecalculation('0');
        updateCalcValue();
      
      "
        
        >0</button>
        
      
        <button
       onclick="
      updatecalculation('.');
        updateCalcValue();
      
      ">.</button>
      
      
      
      <button
      
      onclick="
      calculation= eval(calculation);
      updateCalcValue();
      
    localStorage.setItem('calculation',calculation);
      "
      
      
      
      >=</button>
      
      
      <button class="special"
        
        onclick="
      updatecalculation(' / ');
      updateCalcValue();
      
      "
        
        
        >/</button>
      
      
     <p>   <button


        onclick="
   calculation='';
      console.log('Clear');
   localStorage.setItem('calculation',calculation);
   updateCalcValue()
   

  "
        >Clear</button></p>
           
  <script src="./10i-js.js">

    
       </script>
    </body>
</html>
