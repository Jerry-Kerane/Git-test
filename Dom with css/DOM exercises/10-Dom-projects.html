    <p>Order ubder $40=+$10 shipping</p>

    <input class="js-cost-input" type="text" placeholder="cost of order" onkeydown="

    calculateTotal();

    <script>
        
        function handleCostkeyDown(event){
 
   if (event.key === 'Enter'){
    calculateTotal();
   }
        }





function calculateTotal(){
const inputElement= document.querySelector('.js-cost-input');
let cost=Number(inputElement.value);/* using the number fucntion we convert string into a number and using string we do the reverse*/


 document.querySelector('.js-totale-cost')
          .innerHTML = '';
        document.querySelector('.js-paragraphe2')
          .innerHTML = '';



 if (cost<0) {
document.querySelector('.js-paragraphe2').innerHTML='Error:Cost cannont be less than $0';
return;
}

if(cost < 40){
    cost = cost + 10;
    
}





document.querySelector('.js-totale-cost').innerHTML=`$${cost}`;

}



function Subscribe(){
        const buttonElement=document.querySelector('.Baby');
    if (buttonElement.innerText==='Subscribe'){
        buttonElement.innerText='Subscribed';
        buttonElement.classList.add('is-used');
    }else{
        buttonElement.innerHTML='Subscribe';
        buttonElement.classList.remove('is-used');
    }

}
