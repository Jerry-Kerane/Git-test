<body>
     <button onclick=" updatecart();" >Add to Cart</button>
<p class="add-cart"></p>
    <script>
       
let timdeoutId;
    function updatecart(){
const button= document.querySelector('.add-cart');
button.innerHTML='Added';
clearTimeout(timdeoutId)
timdeoutId=setTimeout(function(){

    button.innerHTML=''
},2000)
}



    </script>
